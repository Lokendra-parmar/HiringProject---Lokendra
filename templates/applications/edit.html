{% extends "base.html" %}

{% block title %}
Edit Candidate
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Edit Candidate</h1>

    <form method="POST">

        <div class="form-group">

            <label for="candidate_name">
                Candidate Name
            </label>

            <input
                type="text"
                id="candidate_name"
                name="candidate_name"
                value="{{ application.candidate_name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="candidate_email">
                Candidate Email
            </label>

            <input
                type="email"
                id="candidate_email"
                name="candidate_email"
                value="{{ application.candidate_email }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="source">
                Source
            </label>

            <input
                type="text"
                id="source"
                name="source"
                value="{{ application.source or '' }}"
            >

        </div>


        <div class="form-group">

            <label for="notes">
                Notes
            </label>

            <textarea
                id="notes"
                name="notes"
                rows="6"
            >{{ application.notes or '' }}</textarea>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for(
                    'applications.application_detail',
                    application_id=application.id
                ) }}"
                class="btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
