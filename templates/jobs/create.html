{% extends "base.html" %}


{% block title %}
Create Job
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>Create Job Opening</h1>


    <form method="POST">

        <div class="form-group">

            <label for="title">
                Job Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ request.form.get('title', '') }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                name="department"
                value="{{ request.form.get('department', '') }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="7"
            >{{ request.form.get('description', '') }}</textarea>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn"
            >
                Create Job
            </button>

            <a
                href="{{ url_for('jobs.job_list') }}"
                class="btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
