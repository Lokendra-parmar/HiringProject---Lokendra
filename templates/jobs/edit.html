{% extends "base.html" %}


{% block title %}
Edit Job
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>Edit Job Opening</h1>


    <form method="POST">

        <div class="form-group">

            <label for="title">
                Job Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ job.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                name="department"
                value="{{ job.department }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="7"
            >{{ job.description or '' }}</textarea>

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="btn"
            >
                Save Changes
            </button>

            <a
                href="{{ url_for('jobs.job_list') }}"
                class="btn-secondary"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
